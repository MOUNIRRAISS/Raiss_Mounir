<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <script src="script.js" defer></script> <!-- Si tu utilises un fichier externe pour ton script -->
</head>
<body>
  <!-- Sélecteur de langue -->
  <select onchange="translatePage(this.value)">
    <option value="fr">Français</option>
    <option value="en">English</option>
  </select>

  <!-- Exemple de contenu à traduire -->
  <h1 data-translate>Welcome to my portfolio</h1>
  <p data-translate>Here, you'll find information about my projects, skills, and experience.</p>
</body>
</html>
